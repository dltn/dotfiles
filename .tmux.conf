# https://github.com/dltn/dotfiles/blob/main/.tmux.conf

# - Rebind <PRE> to Ctrl+A (instead of Ctrl+B). This is a mildly contentious choice (screen/emacs),
#   but I like that it keeps your fingers near home row alongside a Caps Lock → Esc/Ctrl remap.
set -g prefix C-a
bind C-a send-prefix # press Ctrl+A twice to send the prefix to a nested tmux (e.g. over SSH)
unbind C-b

set -g mouse on # enable mouse mode (tmux 2.1+)
set -g base-index 1 # start windows at 1 since QWERTY is 1234...0
set -g escape-time 0 # No delay for escape key
set -g history-limit 10000 # Bigger scrollback
set -g renumber-windows on # automatically renumber windows when one is closed
set -g -w pane-base-index 1 # same as above, for panes
set -g -w mode-keys vi # navigate tmux using vim bindings

# - Remap pane splits to more mnemonic shortcuts (https://hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf)
bind | split-window -h -c "#{pane_current_path}" # use '<PRE>|' to split a pane vertically
bind - split-window -v -c "#{pane_current_path}" # use '<PRE>-' to split a pane horizontally
bind r source-file ~/.tmux.conf \; display "tmux config reloaded" # use '<PRE>r' to reload this file

# - Cycle only through even-horizontal -> even-vertical -> tiled with '<PRE>Space' (the default next-layout
#   also visits main-horizontal/main-vertical). Tracks position per window in the @layout user option.
bind Space if-shell -F '#{==:#{@layout},even-horizontal}' \
  'select-layout even-vertical ; set -w @layout even-vertical' \
  "if-shell -F '#{==:#{@layout},even-vertical}' \
    'select-layout tiled ; set -w @layout tiled' \
    'select-layout even-horizontal ; set -w @layout even-horizontal'"

# - Merge windows for a wide monitor: '<PRE>X' joins every window in the session into one, each window a
#   full-height column that keeps its own pane layout. Pressed again, it explodes the columns back into
#   windows under their old names. '<PRE>P' pins a window (or unpins it) so that merges leave it alone; a
#   pinned window's tab carries a P flag, the way a zoomed one carries a Z. tmux_merge.sh does the work; it
#   lives beside this file, reached through a symlink or a source-file line. While merged, the tab lists the
#   windows (news+apt) from the script's @merge_tab, until the window is renamed by hand.
run-shell 'tmux set -g @dotfiles "$(dirname "$(readlink -f "#{current_file}")")"'
bind X run-shell "'#{@dotfiles}/tmux_merge.sh' toggle '#{session_id}'"
bind P if-shell -F '#{@pinned}' \
  'set -wu @pinned ; display "unpinned: merges include this window"' \
  'set -w @pinned 1 ; display "pinned: merges leave this window alone"'
set-hook -g after-rename-window 'set -wu @merge_tab'

bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# - Clock: 12-hour (12:48p). tmux can only format the system timezone, which is UTC on a server, so this
#   shells out to date instead. @clock_tz picks the zone; when it is unset (a laptop) the system's own zone
#   is used. Hosts running on UTC default to Eastern, and '<PRE>T' flips between Eastern and Pacific.
if-shell '[ "$(date +%Z)" = UTC ]' 'set -goq @clock_tz America/New_York'
bind T if-shell -F '#{==:#{@clock_tz},America/New_York}' \
  'set -g @clock_tz America/Los_Angeles' \
  'set -g @clock_tz America/New_York' \; refresh-client -S

# - Responsive status bar: shorten window names and drop zone and date when terminal is narrow (< 80 cols).
#   @flags is tmux's window flags plus P for a window pinned out of merges. @tab is the number and name: a
#   merged window's names are each coloured on their own, any other tab takes one colour for the lot.
set -g @flags '#{window_flags}#{?@pinned,P,}'
set -g @tab '#{?@merge_tab,#I:#{E:@merge_tab}#[default],#{E:@claude_fg}#I:#W}'
set -g status-right ' #(#{?@clock_tz,TZ=#{@clock_tz} ,}date +"%%-I:%%M%%p#{?#{e|<:#{client_width},80},, %%Z %%d-%%b-%%y}" | sed "s/AM/a/;s/PM/p/") '
set -g window-status-format '#{?#{e|<:#{client_width},80},#{E:@claude_fg}#I:#{=3:window_name}#{E:@flags} ,#{E:@tab}#{?#{E:@flags},#{E:@flags}, }}'
set -g window-status-current-format '#{?#{e|<:#{client_width},80},#{E:@claude_fg}#I:#{=3:window_name}#{E:@flags} ,#{E:@tab}#{?#{E:@flags},#{E:@flags}, }}'

# - Per-pane titles: show the pane's title if it has one. In a merged window the title starts with the
#   window the pane came from, in grey: [ apt: my title ], or just [ apt ] for a pane with no title.
set -g pane-border-lines heavy
set -g pane-border-status top
set -g @merge_title '#{E:@claude_pane_fg} [ #[fg=colour245]#{@merge_name}#{?pane_title,: ,}#[default]#{E:@claude_pane_fg}#{pane_title} ] #[default]'
set -g pane-border-format "#{?@merge_group,#{E:@merge_title},#{?pane_title,#{E:@claude_pane_fg} [ #{pane_title} ] #[default],}}"
set-hook -g after-split-window 'selectp -T ""'
set-hook -g after-new-window 'selectp -T ""'
set-hook -g after-new-session 'selectp -T ""'
bind . command-prompt -p "(rename-pane)" -I "#T" "select-pane -T '%%'"

# - Theme: dark grey bar, session name in a lighter grey block (cut to 8 chars when narrow), current window
#   picked out in white. Copy-mode selection and the vi command prompt reuse the lighter grey block.
set -g status-style bg=colour236,fg=colour248
set -g status-left-length 30
set -g status-left '#[bg=colour245,fg=colour236,bold] #{?#{e|<:#{client_width},80},#{=8:session_name},#S} #[default] '
set -g window-status-current-style fg=colour255,bold
set -g message-style bg=colour238,fg=colour255
set -g message-command-style bg=colour245,fg=colour236
set -g mode-style bg=colour245,fg=colour236

# - Claude Code windows: the tab turns green while a Claude in the window is working and orange when one is
#   waiting on you (finished, or asking for permission/input); other windows keep the grey/white theme.
#   Pane borders and titles follow the same scheme per pane, to tell apart Claudes sharing a window: grey
#   for ordinary panes, green or orange for a Claude, brighter on the active pane and dimmer on the rest.
#   The Claude Code hooks in claude_hooks.json (installed by setup_claude_hooks.sh) run claude_tmux_state.sh,
#   which records each pane's state in @claude_state. Panes no longer running claude are ignored, so a
#   killed session can't leave a stale colour behind. (On macOS tmux reports a native-install Claude as its
#   version number, e.g. 2.1.282, rather than "claude".) In a merged window's tab each name is coloured by
#   its own panes: tmux_merge.sh copies @merge_fg in front of every name, with GROUP swapped for the number
#   that window's panes carry in @merge_group.
set -g @claude_waiting colour208
set -g @claude_waiting_dim colour130
set -g @claude_working colour71
set -g @claude_working_dim colour28
set -g @claude_pane_state '#{?#{m/r:^(claude|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}},#{@claude_state},}'
set -g @claude_pane_fg '#{?#{==:#{E:@claude_pane_state},waiting},#[fg=#{@claude_waiting}],#{?#{==:#{E:@claude_pane_state},working},#[fg=#{@claude_working}],}}'
set -g @claude_states '#{P:#{E:@claude_pane_state} }'
set -g @claude_fg '#{?#{m:*waiting*,#{E:@claude_states}},#[fg=#{@claude_waiting}],#{?#{m:*working*,#{E:@claude_states}},#[fg=#{@claude_working}],}}'
set -g @merge_fg '#{?#{m:*waiting*,#{P:#{?#{==:#{@merge_group},GROUP},#{E:@claude_pane_state} ,}}},#[fg=#{@claude_waiting}],#{?#{m:*working*,#{P:#{?#{==:#{@merge_group},GROUP},#{E:@claude_pane_state} ,}}},#[fg=#{@claude_working}],}}'
set -g pane-border-style '#{?#{==:#{E:@claude_pane_state},waiting},fg=#{@claude_waiting_dim},#{?#{==:#{E:@claude_pane_state},working},fg=#{@claude_working_dim},fg=colour240}}'
set -g pane-active-border-style '#{?#{==:#{E:@claude_pane_state},waiting},fg=#{@claude_waiting},#{?#{==:#{E:@claude_pane_state},working},fg=#{@claude_working},fg=colour250}}'
