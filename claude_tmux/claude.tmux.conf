# Claude Code session state in tmux: green while a Claude is working, orange when one is waiting on you
# (finished, or asking for permission/input). Source this file from your tmux config; README.md has the rest.
#
# The Claude Code hooks in claude_hooks.json (installed by setup_claude_hooks.sh) run claude_tmux_state.sh,
# which records each pane's state in the pane option @claude_state. Panes no longer running claude are
# ignored, so a killed session can't leave a stale colour behind. (On macOS tmux reports a native-install
# Claude as its version number, e.g. 2.1.282, rather than "claude".)

# - Colours. To change one, set it again after the line that sources this file. The last two are the
#   border styles of panes with no Claude in them.
set -g @claude_waiting colour208
set -g @claude_waiting_dim colour130
set -g @claude_working colour71
set -g @claude_working_dim colour28
set -g @claude_border fg=colour240
set -g @claude_active_border fg=colour250

# - State: of a pane (working, waiting or nothing), and of a window (the states of all its panes).
set -g @claude_pane_state '#{?#{m/r:^(claude|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}},#{@claude_state},}'
set -g @claude_states '#{P:#{E:@claude_pane_state} }'

# - For your own formats. #{E:@claude_fg} colours what follows it by the window's state, for a tab in
#   window-status-format; waiting wins if the window's Claudes differ. #{E:@claude_pane_fg} does the same
#   by the pane's state, for a title in pane-border-format. Neither changes anything where no Claude is.
set -g @claude_fg '#{?#{m:*waiting*,#{E:@claude_states}},#[fg=#{@claude_waiting}],#{?#{m:*working*,#{E:@claude_states}},#[fg=#{@claude_working}],}}'
set -g @claude_pane_fg '#{?#{==:#{E:@claude_pane_state},waiting},#[fg=#{@claude_waiting}],#{?#{==:#{E:@claude_pane_state},working},#[fg=#{@claude_working}],}}'

# - Pane borders, to tell apart Claudes sharing a window: brighter on the active pane, dimmer on the rest.
set -g pane-border-style '#{?#{==:#{E:@claude_pane_state},waiting},fg=#{@claude_waiting_dim},#{?#{==:#{E:@claude_pane_state},working},fg=#{@claude_working_dim},#{@claude_border}}}'
set -g pane-active-border-style '#{?#{==:#{E:@claude_pane_state},waiting},fg=#{@claude_waiting},#{?#{==:#{E:@claude_pane_state},working},fg=#{@claude_working},#{@claude_active_border}}}'
