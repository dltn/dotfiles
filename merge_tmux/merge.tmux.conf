# Merge a session's windows into one window of side-by-side columns, for a wide monitor, and explode them
# back out. Source this file from your tmux config; README.md has the rest.

# - Keys: '<PRE>X' joins every window in the session into one, each window a full-height column that keeps
#   its own pane layout. Pressed again, it explodes the columns back into windows under their old names.
#   '<PRE>P' pins a window (or unpins it) so that merges leave it alone. merge.sh, beside this file, does
#   the work.
set -gF @merge_dir '#{d:current_file}'
bind X run-shell "'#{@merge_dir}/merge.sh' toggle '#{session_id}'"
bind P if-shell -F '#{@merge_pinned}' \
  'set -wu @merge_pinned ; display "unpinned: merges include this window"' \
  'set -w @merge_pinned 1 ; display "pinned: merges leave this window alone"'

# - For your own tab format. #{E:@merge_flags} is tmux's #{window_flags} with a P added on a pinned window.
#   #{E:@merge_names} is #W, except that in a merged window each name (news+apt) can have its own colour:
#   if @merge_fg is set when windows are merged, merge.sh puts a copy in front of each name, with GROUP
#   swapped for the number that window's panes carry in @merge_group. Renaming a merged window by hand
#   drops the coloured names for it.
set -g @merge_flags '#{window_flags}#{?@merge_pinned,P,}'
set -g @merge_names '#{?@merge_tab,#{E:@merge_tab}#[default],#W}'
set-hook -g 'after-rename-window[90]' 'set -wuq @merge_tab'
